# Git hooks (replaces husky + lint-staged). Installed by `pnpm install` via the prepare script.
glob_matcher: doublestar
rc: scripts/hooks/path.sh

pre-commit:
  piped: true # eslint --fix before prettier on the same files
  jobs:
    - name: eslint web
      root: apps/web/
      glob: "apps/web/**/*.{ts,tsx,mts}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: eslint ui
      root: packages/ui/
      glob: "packages/ui/**/*.{ts,tsx,mts}"
      run: pnpm exec eslint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob:
        - "**/*.{js,mjs,cjs,ts,json,md,css,yml,yaml}"
        - "{apps/web,packages/ui}/**/*.{tsx,mts}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: secret scan
      run: sh scripts/security/secret-scan-staged.sh

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
