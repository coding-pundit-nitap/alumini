# Git hooks (replaces husky + lint-staged). Installed by `pnpm install` via the prepare script.
glob_matcher: doublestar
rc: packages/scripts/hooks/path.sh

pre-commit:
  piped: true # oxlint --fix before prettier on the same files
  jobs:
    - name: oxlint web
      root: apps/web/
      glob: "apps/web/**/*.{ts,tsx,mts}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: oxlint ui
      root: packages/ui/
      glob: "packages/ui/**/*.{ts,tsx,mts}"
      run: pnpm exec oxlint --fix {staged_files}
      stage_fixed: true
    - name: prettier
      glob:
        - "**/*.{js,mjs,cjs,ts,json,md,css,yml,yaml}"
        - "{apps/web,packages/ui}/**/*.{tsx,mts}"
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true
    - name: migration drift
      glob: "packages/database/prisma/{schema.prisma,migrations/**}"
      run: node --env-file-if-exists=.env packages/scripts/check-migration-drift.ts --skip-unreachable
    - name: secret scan
      run: sh packages/scripts/security/secret-scan-staged.sh

commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}
