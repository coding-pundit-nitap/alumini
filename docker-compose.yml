# Local development services. Production topology is described in docs/system-architecture.md.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumini
      POSTGRES_PASSWORD: alumini
      POSTGRES_DB: alumini
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumini"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
