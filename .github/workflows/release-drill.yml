# Release and alert drills: monthly, by hand, and on changes to the files they exercise.
#   drill   packages/scripts/drills/release.ts
#   alerts  packages/scripts/drills/alerts.ts
name: Release and alert drills

on:
  schedule:
    - cron: "30 22 1 * *" # 04:00 IST on the 1st, after the restore drill
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/compose.yml
      - deploy/deploy.sh
      - deploy/monitoring.yml
      - deploy/monitoring.sh
      - docker/**
      - ops/**
      - packages/scripts/drills/release.ts
      - packages/scripts/drills/alerts.ts
      - .github/workflows/release-drill.yml

permissions:
  contents: read

concurrency:
  group: release-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Release drill (staging → promote → rollback)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      # The images the drill releases, from the same layer cache as pr.yml's image jobs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          target: run
          build-args: GIT_SHA=drill
          tags: alumini-web:drill
          load: true
          cache-from: type=gha,scope=web
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          target: migrate
          build-args: GIT_SHA=drill
          tags: alumini-migrate:drill
          load: true
          cache-from: type=gha,scope=migrate
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          target: run
          build-args: GIT_SHA=drill
          tags: alumini-worker:drill
          load: true
          cache-from: type=gha,scope=worker
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/postgres.Dockerfile
          tags: alumini-postgres:drill
          load: true
          cache-from: type=gha,scope=postgres
      - name: Drill
        env:
          DRILL_HOST: "a GitHub Actions runner (ubuntu-24.04, run ${{ github.run_id }})"
        run: node packages/scripts/drills/release.ts --skip-build --summary "$GITHUB_STEP_SUMMARY"

  alerts:
    name: Alert drill (page, ticket, inhibition, dead-man's switch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Drill
        env:
          DRILL_HOST: "a GitHub Actions runner (ubuntu-24.04, run ${{ github.run_id }})"
        run: node packages/scripts/drills/alerts.ts --summary "$GITHUB_STEP_SUMMARY"
