# Release and alert drills (reliability §5.1, §8.3–§8.5, §11; specs 18B, 18C), monthly, by hand, and on any change
# to the files they exercise, so a change is rehearsed before a server runs it. Each result table is its run's
# summary.
#   drill   packages/scripts/drills/release.ts: the production release tooling (deploy/compose.yml, deploy.sh) in
#           staging and production clones of a local origin with a local registry, through pull → promote →
#           rollback → promote with an expand migration, measuring each release's interruption (PRD-2); then
#           deploy/monitoring.sh against production, every target up.
#   alerts  packages/scripts/drills/alerts.ts: Prometheus and Alertmanager from deploy/monitoring.yml with the
#           production rules and routing deliver a page, a ticket and the dead-man's-switch heartbeat to a sink,
#           group and inhibit as configured, and the heartbeat stops when Prometheus does (PRD-8).
name: Release and alert drills

on:
  schedule:
    - cron: "30 22 1 * *" # 04:00 IST on the 1st, after the restore drill
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/compose.yml
      - deploy/deploy.sh
      - deploy/monitoring.yml
      - deploy/monitoring.sh
      - docker/**
      - ops/**
      - packages/scripts/drills/release.ts
      - packages/scripts/drills/alerts.ts
      - .github/workflows/release-drill.yml

permissions:
  contents: read

concurrency:
  group: release-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drill:
    name: Release drill (staging → promote → rollback)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      # The images the drill releases, from the same layer cache as pr.yml's image jobs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          target: run
          build-args: GIT_SHA=drill
          tags: nitap-web:drill
          load: true
          cache-from: type=gha,scope=web
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/web.Dockerfile
          target: migrate
          build-args: GIT_SHA=drill
          tags: nitap-migrate:drill
          load: true
          cache-from: type=gha,scope=migrate
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/worker.Dockerfile
          target: run
          build-args: GIT_SHA=drill
          tags: nitap-worker:drill
          load: true
          cache-from: type=gha,scope=worker
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/postgres.Dockerfile
          tags: nitap-postgres:drill
          load: true
          cache-from: type=gha,scope=postgres
      - name: Drill
        env:
          DRILL_HOST: "a GitHub Actions runner (ubuntu-24.04, run ${{ github.run_id }})"
        run: node packages/scripts/drills/release.ts --skip-build --summary "$GITHUB_STEP_SUMMARY"

  alerts:
    name: Alert drill (page, ticket, inhibition, dead-man's switch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Drill
        env:
          DRILL_HOST: "a GitHub Actions runner (ubuntu-24.04, run ${{ github.run_id }})"
        run: node packages/scripts/drills/alerts.ts --summary "$GITHUB_STEP_SUMMARY"
