# Pull-request pipeline (docs/architecture/development-and-testing-strategy.md §18.1).
# Every gate starts at once, so a run takes as long as its slowest job rather than the sum of a chain; images
# are published only after all of them pass. Turbo's task cache, Next's build cache, Playwright's browsers and
# the image layers persist between runs.
# Every job reproduces a local command: pnpm lint | typecheck | arch | test | test:integration | build | test:e2e.
name: PR

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on a branch are cancelled; main runs are never cancelled (§18.4 rule 3).
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: "true"
  # Placeholders for jobs that never connect; Prisma and env validation only need the variables to exist.
  DATABASE_URL: postgresql://alumini:alumini@localhost:5432/alumini
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-github-actions-0000
  BETTER_AUTH_URL: http://localhost:3000
  QUEUE_REDIS_URL: redis://localhost:6380
  APP_URL: http://localhost:3000
  SMTP_URL: smtp://localhost:1025
  EMAIL_FROM: NITAP <no-reply@alumni.test>
  INSTITUTIONAL_EMAIL_POLICY: '{"nitap.ac.in":{"role":"STUDENT","autoVerify":true},"staff.nitap.ac.in":{"role":"STAFF","autoVerify":false}}'
  DEV_COORDINATOR_EMAIL: coordinator@nitap.example
  DEV_COORDINATOR_PASSWORD: ci-coordinator-password-1234
  MAILPIT_URL: http://localhost:8025
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: alumini-uploads
  S3_ACCESS_KEY_ID: alumini-storage
  S3_SECRET_ACCESS_KEY: alumini-storage-secret
  S3_FORCE_PATH_STYLE: "true"

jobs:
  static:
    name: Static (format, types, lint, architecture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays a task whose inputs are unchanged since an earlier run instead of running it again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm worker:prune:check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Organisation-owned repositories need a GITLEAKS_LICENSE secret for this action.
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # Alert rules fire on injected conditions, Alertmanager config is valid, every alert links a runbook
  # (spec 13C C-8). Needs only Node and Docker; it reproduces `pnpm ops:check`.
  observability:
    name: Monitoring as code (promtool, amtool, runbooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-ops.mjs

  dependency-audit:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Blocking by design (§18.2). Findings are fixed, or accepted explicitly with a reason in
      # pnpm-workspace.yaml (auditConfig) so the exception is reviewed like code.
      - run: pnpm audit --audit-level high

  # SAST (strategy §10.2, spec 16 16E): the project rules' own tests, then registry packs plus project rules.
  # ERROR findings block; a reviewed exception is a `nosemgrep: <rule-id> — <reason>` comment on the line.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Project rules match their fixtures
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.140.0 semgrep scan --test --metrics=off .semgrep
      - name: Scan
        run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.140.0 semgrep scan --metrics=off
          --config p/typescript --config p/react --config p/nodejs --config p/secrets
          --config .semgrep/rules.yml --exclude .semgrep --severity ERROR --error

  # Container images (strategy §18.2 "Build (web + worker images), image scan"; spec 16 16E). Dockerfile lint
  # and CRITICAL vulnerabilities block; HIGH ones are listed in the log for triage.
  images:
    name: Image ${{ matrix.image }} (hadolint, build, Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
            target: run
            scan: true
          - image: worker
            file: docker/worker.Dockerfile
            target: run
            scan: true
          - image: migrate
            file: docker/web.Dockerfile
            target: migrate
            scan: false
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint --failure-threshold error - < ${{ matrix.file }}
      - uses: docker/setup-buildx-action@v4
      # Layers go to the Actions cache, scoped per image; publish builds the same commit from it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: nitap-${{ matrix.image }}:${{ github.sha }}
          load: ${{ matrix.scan }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Scan image
        if: matrix.scan
        run: |
          image="nitap-${{ matrix.image }}:${{ github.sha }}"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
            --quiet --scanners vuln --severity HIGH,CRITICAL "$image"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
            --quiet --scanners vuln --severity CRITICAL --exit-code 1 "$image"

  unit:
    name: Unit and component tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays a task whose inputs are unchanged since an earlier run instead of running it again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # A pull request tests what its change can affect; main runs every package whose inputs changed.
      - run: ${{ github.event_name == 'pull_request' && 'pnpm turbo run test --affected' || 'pnpm test' }}

  integration:
    name: Integration and contract tests (${{ matrix.suite }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Web's suite alone needs ~15 min on one runner, so it is split into shards; the other
    # packages' suites are small and run together. Each leg has its own services.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: packages
            run: pnpm turbo run test:integration --filter=!@nitap/web
          - suite: web 1/3
            run: pnpm --filter @nitap/web test:integration --shard=1/3
          - suite: web 2/3
            run: pnpm --filter @nitap/web test:integration --shard=2/3
          - suite: web 3/3
            run: pnpm --filter @nitap/web test:integration --shard=3/3
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alumini
          POSTGRES_PASSWORD: alumini
          POSTGRES_DB: alumini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alumini" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # GitHub service containers cannot take server flags, so this instance uses defaults; tests only
      # need a working Redis. Production and local compose use noeviction + AOF.
      queue-redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every migration must apply to an empty database.
      # MinIO cannot be a `services:` entry (no command override there), so start it directly and make the bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            -e MINIO_API_CORS_ALLOW_ORIGIN=$BETTER_AUTH_URL \
            cgr.dev/chainguard/minio server /data
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio -c \
            "until mc alias set local $S3_ENDPOINT $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY; do sleep 1; done && mc mb --ignore-existing local/$S3_BUCKET"
      - run: pnpm db:deploy
      - run: ${{ matrix.run }}

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays a task whose inputs are unchanged since an earlier run instead of running it again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # No server variable name or credential in what browsers download (strategy §10.1, spec 16 16E).
      - run: node scripts/security/scan-client-bundle.mjs

  e2e:
    name: E2E smoke (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One worker against `next dev` (every route compiles on first visit) outgrew a single runner, so the
    # journeys are split into shards like the integration suite. Each leg has its own services and data.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: alumini
          POSTGRES_PASSWORD: alumini
          POSTGRES_DB: alumini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alumini" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      queue-redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO cannot be a `services:` entry (no command override there), so start it directly and make the bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            -e MINIO_API_CORS_ALLOW_ORIGIN=$BETTER_AUTH_URL \
            cgr.dev/chainguard/minio server /data
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio -c \
            "until mc alias set local $S3_ENDPOINT $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY; do sleep 1; done && mc mb --ignore-existing local/$S3_BUCKET"
      - run: pnpm db:deploy
      # Sign-up assigns roles, which the seed creates.
      - run: pnpm --filter @nitap/database db:seed
      # The verification journeys sign in as a seeded alumni coordinator.
      - run: pnpm --filter @nitap/web db:seed:admin
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @nitap/web exec playwright install --with-deps chromium
      # Runs against `next dev` for now; it moves to the built images with the Docker pipeline (Phase 15).
      # Called directly rather than through turbo, which holds a task's output until it exits: a run that
      # hits the job timeout would otherwise leave an empty log. Prisma Client is generated on install.
      - run: pnpm --filter @nitap/web test:e2e --shard=${{ matrix.shard }}
      # always(): a timed-out job is "cancelled", not "failed", and that is when the report matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report
          retention-days: 7

  # Release images (reliability §8.2: one image per process per commit, promoted unchanged). Only a main commit
  # that passed every gate is published, so `deploy/deploy.sh pull` never finds an image for a red commit.
  # Tagged with the full SHA; `main` points at the newest. ghcr.io needs a lowercase owner.
  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      [
        static,
        secret-scan,
        observability,
        dependency-audit,
        sast,
        images,
        unit,
        integration,
        build,
        e2e,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
            target: run
          - image: worker
            file: docker/worker.Dockerfile
            target: run
          - image: migrate
            file: docker/web.Dockerfile
            target: migrate
    steps:
      - uses: actions/checkout@v7
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nitap-" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same commit, same cache scope as the images job: every layer is a cache hit.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}${{ matrix.image }}:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
