# Pull-request pipeline. Every gate runs in parallel; images are published only after all of them pass.
# Each job reproduces a local command: pnpm lint | typecheck | arch | test | test:integration | build | test:e2e.
name: PR

on:
  pull_request:
  push:
    branches: [main]

# Superseded runs on a branch are cancelled; main runs are never cancelled (rule 3).
concurrency:
  group: pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CI: "true"
  # Placeholders for jobs that never connect; Prisma and env validation only need the variables to exist.
  DATABASE_URL: postgresql://alumini:alumini@localhost:5432/alumini
  REDIS_URL: redis://localhost:6379
  BETTER_AUTH_SECRET: ci-only-secret-not-used-outside-github-actions-0000
  BETTER_AUTH_URL: http://localhost:3000
  QUEUE_REDIS_URL: redis://localhost:6380
  APP_URL: http://localhost:3000
  SMTP_URL: smtp://localhost:1025
  EMAIL_FROM: NITAP <no-reply@alumni.test>
  INSTITUTIONAL_EMAIL_POLICY: '{"nitap.ac.in":{"role":"STUDENT","autoVerify":true},"staff.nitap.ac.in":{"role":"STAFF","autoVerify":false}}'
  DEV_COORDINATOR_EMAIL: coordinator@nitap.example
  DEV_COORDINATOR_PASSWORD: ci-coordinator-password-1234
  MAILPIT_URL: http://localhost:8025
  S3_ENDPOINT: http://localhost:9000
  S3_REGION: us-east-1
  S3_BUCKET: alumini-uploads
  S3_ACCESS_KEY_ID: alumini-storage
  S3_SECRET_ACCESS_KEY: alumini-storage-secret
  S3_FORCE_PATH_STYLE: "true"

jobs:
  # Decides what the rest of the run needs. A pull request is compared with its base as a whole, so a later
  # docs-only push still runs everything the earlier pushes touched. main always runs every job; its base is
  # the last commit whose run passed, so a red commit stays in scope until a later run is green.
  changes:
    name: Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # gh run list
    outputs:
      code: ${{ steps.diff.outputs.code }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Base commit
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          else
            base=$(gh run list -R "$GITHUB_REPOSITORY" --workflow pr.yml --branch main --event push \
              --status success --limit 1 --json headSha -q '.[0].headSha' || true)
            base="${base:-$BEFORE}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base=""; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "Base: ${base:-none (full run)}"
      # Anything not listed as documentation counts as code, so an unknown path runs everything.
      # Markdown under apps/ and packages/ is code: tests read some of it.
      - name: Code changed?
        id: diff
        env:
          BASE: ${{ steps.base.outputs.sha }}
        run: |
          code=true
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ -n "$BASE" ]; then
            code=false
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              case "$f" in
                docs/* | deploy/docs/* | deploy/README.md | ops/* | perf/* | .zap/* | .semgrep/* \
                  | .gitleaksignore | renovate.json | .github/dependabot.yml \
                  | .github/workflows/nightly.yml | .github/workflows/*-drill.yml) continue ;;
              esac
              [[ "$f" == *.md && "$f" != */* ]] && continue
              echo "Code change: $f"
              code=true
              break
            done <<< "$(git diff --name-only "$BASE" HEAD)"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code"

  static:
    name: Static (format, types, lint, architecture)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays a task whose inputs are unchanged since an earlier run instead of running it again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm arch
      - run: pnpm knip
      - run: pnpm worker:prune:check

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The gitleaks CLI, not gitleaks-action: the action needs a paid license on organisation repositories.
      # Same pinned image as the pre-commit hook; .gitleaksignore holds the reviewed exceptions.
      - name: gitleaks (full history)
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo
          ghcr.io/gitleaks/gitleaks:v8.30.0 git --redact --no-banner /repo

  # Alert rules fire on injected conditions, Alertmanager config is valid, every alert links a runbook.
  # Needs only Node and Docker; it reproduces `pnpm ops:check`.
  observability:
    name: Monitoring as code (promtool, amtool, runbooks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: node packages/scripts/check-ops.ts

  dependency-audit:
    name: Dependency audit (high and critical)
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Blocks only a change that touches dependencies: an advisory published overnight is not the fault
      # of an unrelated pull request. New advisories against an unchanged lockfile fail the nightly run instead.
      - name: Did dependencies change?
        id: deps
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null \
            || ! git diff --quiet "$BASE" HEAD -- pnpm-lock.yaml pnpm-workspace.yaml package.json '**/package.json'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Dependencies unchanged since $BASE; the nightly audit covers new advisories."
          fi
      - if: steps.deps.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.deps.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.deps.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile
      # Findings are fixed, or accepted explicitly with a reason in pnpm-workspace.yaml (auditConfig) so the
      # exception is reviewed like code.
      - if: steps.deps.outputs.changed == 'true'
        run: pnpm audit --audit-level high

  # SAST: the project rules' own tests, then registry packs plus project rules.
  # ERROR findings block; a reviewed exception is a `nosemgrep: <rule-id> — <reason>` comment on the line.
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Project rules match their fixtures
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep:1.140.0 semgrep scan --test --metrics=off .semgrep
      - name: Scan
        run: >-
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.140.0 semgrep scan --metrics=off
          --config p/typescript --config p/react --config p/nodejs --config p/secrets
          --config .semgrep/rules.yml --exclude .semgrep --severity ERROR --error

  # Container images: Dockerfile lint and CRITICAL vulnerabilities block; HIGH ones are logged for triage.
  images:
    name: Image ${{ matrix.image }} (hadolint, build, Trivy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
            target: run
            scan: true
          - image: worker
            file: docker/worker.Dockerfile
            target: run
            scan: true
          - image: migrate
            file: docker/web.Dockerfile
            target: migrate
            scan: false
          # PostgreSQL + pgBackRest. Published with the app images.
          - image: postgres
            file: docker/postgres.Dockerfile
            target: ""
            scan: true
    steps:
      - uses: actions/checkout@v7
      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint:v2.14.0 hadolint --failure-threshold error - < ${{ matrix.file }}
      - uses: docker/setup-buildx-action@v4
      # Layers go to the Actions cache, scoped per image; publish builds the same commit from it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: alumini-${{ matrix.image }}:${{ github.sha }}
          load: ${{ matrix.scan }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
      - name: Scan image
        if: matrix.scan
        run: |
          image="alumini-${{ matrix.image }}:${{ github.sha }}"
          # .trivyignore.yaml holds the reviewed exceptions, each scoped to one file.
          trivy() {
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/.trivyignore.yaml:/.trivyignore.yaml:ro" aquasec/trivy:0.67.2 image \
              --quiet --scanners vuln --ignorefile /.trivyignore.yaml "$@" "$image"
          }
          trivy --severity HIGH,CRITICAL
          trivy --severity CRITICAL --exit-code 1

  unit:
    name: Unit and component tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # turbo --affected compares against the base branch
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays a task whose inputs are unchanged since an earlier run instead of running it again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      # A pull request tests what its change can affect; main runs every package whose inputs changed.
      - run: ${{ github.event_name == 'pull_request' && 'pnpm turbo run test --affected' || 'pnpm test' }}

  integration:
    name: Integration and contract tests (${{ matrix.suite }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Web's suite is sharded (~15 min on one runner); other packages run together. Shards leave blob reports
    # that the coverage job merges, so the thresholds hold for the whole suite.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: packages
            run: pnpm turbo run test:integration --filter=!@nitap/web
          - suite: web 1/3
            run: pnpm --filter @nitap/web exec vitest run --coverage --reporter=default --reporter=blob --shard=1/3
            coverage: true
          - suite: web 2/3
            run: pnpm --filter @nitap/web exec vitest run --coverage --reporter=default --reporter=blob --shard=2/3
            coverage: true
          - suite: web 3/3
            run: pnpm --filter @nitap/web exec vitest run --coverage --reporter=default --reporter=blob --shard=3/3
            coverage: true
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: alumini
          POSTGRES_PASSWORD: alumini
          POSTGRES_DB: alumini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alumini" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      # GitHub service containers cannot take server flags, so this instance uses defaults; tests only
      # need a working Redis. Production and local compose use noeviction + AOF.
      queue-redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every migration must apply to an empty database. MinIO can't be a `services:` entry (no command
      # override), so start it directly and create the bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            -e MINIO_API_CORS_ALLOW_ORIGIN=$BETTER_AUTH_URL \
            cgr.dev/chainguard/minio server /data
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio -c \
            "until mc alias set local $S3_ENDPOINT $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY; do sleep 1; done && mc mb --ignore-existing local/$S3_BUCKET"
      - run: pnpm db:deploy
      # The migrations must build exactly what schema.prisma declares, or the next `migrate dev` undoes the
      # difference. Once per run, on the leg that already has Postgres.
      - if: matrix.suite == 'packages'
        run: pnpm db:drift
      - run: ${{ matrix.run }}
        env:
          COVERAGE_SHARD: ${{ matrix.coverage && '1' || '' }}
      - if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-blob-${{ strategy.job-index }}
          path: apps/web/.vitest/blob/
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Coverage (web, every suite merged)
    needs: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          pattern: coverage-blob-*
          path: apps/web/.vitest/blob
          merge-multiple: true
      # Fails when statements, lines or functions fall below 95 % or branches below 90 % (vitest.config.mts).
      - run: pnpm --filter @nitap/web exec vitest --merge-reports --coverage

  # New migrations run against a seeded database while pg_locks is sampled: a write-blocking lock over
  # 1 s on an existing table fails. Runs only when migrations are added.
  migration-locks:
    name: Migration locks on volume
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: alumini
          POSTGRES_PASSWORD: alumini
          POSTGRES_DB: alumini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alumini" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Were migrations added?
        id: migrations
        env:
          BASE: ${{ needs.changes.outputs.base }}
        run: |
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "$BASE^{commit}" 2>/dev/null \
            && [ -n "$(git diff --name-only --diff-filter=A "$BASE" HEAD -- packages/database/prisma/migrations)" ]; then
            echo "added=true" >> "$GITHUB_OUTPUT"
            echo "base=$BASE" >> "$GITHUB_OUTPUT"
          else
            echo "added=false" >> "$GITHUB_OUTPUT"
            echo "No migrations added since ${BASE:-the base}."
          fi
      - if: steps.migrations.outputs.added == 'true'
        uses: pnpm/action-setup@v6
      - if: steps.migrations.outputs.added == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.migrations.outputs.added == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.migrations.outputs.added == 'true'
        run: >-
          node packages/scripts/check-migration-locks.ts --base "${{ steps.migrations.outputs.base }}"
          --summary "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Turbo replays a task whose inputs are unchanged since an earlier run instead of running it again.
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.job }}-${{ github.sha }}
          restore-keys: turbo-${{ github.job }}-
      - uses: actions/cache@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm build
      # No server variable name or credential in what browsers download.
      - run: node packages/scripts/security/scan-client-bundle.ts

  e2e:
    name: E2E smoke (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The journeys run against the production build (`next start`), split into shards like the integration
    # suite. Each leg has its own services and data.
    strategy:
      fail-fast: false
      matrix:
        shard: [1/3, 2/3, 3/3]
    env:
      # A production server shows /health/ready details only to this token (health.spec.ts sends it).
      HEALTH_CHECK_TOKEN: ci-only-health-token-0000
      # Mailpit takes any rate; an announcement's fan-out at the default 5/s queues the next sign-up's email.
      EMAIL_RATE_PER_SECOND: "100"
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: alumini
          POSTGRES_PASSWORD: alumini
          POSTGRES_DB: alumini
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alumini" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      queue-redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]
        options: >-
          --health-cmd "/mailpit readyz" --health-interval 5s
          --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # MinIO cannot be a `services:` entry (no command override there), so start it directly and make the bucket.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=$S3_ACCESS_KEY_ID -e MINIO_ROOT_PASSWORD=$S3_SECRET_ACCESS_KEY \
            -e MINIO_API_CORS_ALLOW_ORIGIN=$BETTER_AUTH_URL \
            cgr.dev/chainguard/minio server /data
          docker run --rm --network host --entrypoint sh cgr.dev/chainguard/minio -c \
            "until mc alias set local $S3_ENDPOINT $S3_ACCESS_KEY_ID $S3_SECRET_ACCESS_KEY; do sleep 1; done && mc mb --ignore-existing local/$S3_BUCKET"
      - run: pnpm db:deploy
      # Sign-up assigns roles, which the seed creates.
      - run: pnpm --filter @nitap/database db:seed
      # The verification journeys sign in as a seeded alumni coordinator.
      - run: pnpm --filter @nitap/web db:seed:admin
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @nitap/web exec playwright install --with-deps chromium
      # Restore-only: the Build job owns this cache; each shard reuses its compiler cache for its own build.
      - uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      # playwright.config.ts serves this build with `next start` when CI is set.
      - run: pnpm --filter @nitap/web build
      # Called directly rather than through turbo, which holds a task's output until it exits: a run that
      # hits the job timeout would otherwise leave an empty log. Prisma Client is generated on install.
      - run: pnpm --filter @nitap/web test:e2e --shard=${{ matrix.shard }}
      # always(): a timed-out job is "cancelled", not "failed", and that is when the report matters most.
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: apps/web/playwright-report
          retention-days: 7

  # The one required check in branch protection. Passes when every job passed or was skipped as not needed,
  # so jobs can be added or filtered without touching the branch rules.
  ci-ok:
    name: CI OK
    if: always()
    needs:
      [
        changes,
        static,
        secret-scan,
        observability,
        dependency-audit,
        sast,
        images,
        unit,
        integration,
        coverage,
        migration-locks,
        build,
        e2e,
      ]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS"
          exit 1
      - run: echo "Every job passed or was not needed."

  # Release images: only main commits that passed every gate are published, tagged with the full SHA;
  # `main` points at the newest. ghcr.io needs a lowercase owner.
  publish:
    name: Publish images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-ok
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: web
            file: docker/web.Dockerfile
            target: run
          - image: worker
            file: docker/worker.Dockerfile
            target: run
          - image: migrate
            file: docker/web.Dockerfile
            target: migrate
          # Released by digest like the others, rather than built on the server.
          - image: postgres
            file: docker/postgres.Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/alumini-" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same commit, same cache scope as the images job: every layer is a cache hit.
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: GIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ steps.prefix.outputs.value }}${{ matrix.image }}:${{ github.sha }}
            ${{ steps.prefix.outputs.value }}${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}
      # Staging pins these digests when it pulls the tag, and production promotes exactly them.
      - name: Record digest
        run: >-
          echo "${{ matrix.image }}: ${{ steps.prefix.outputs.value }}${{ matrix.image }}@${{ steps.push.outputs.digest }}"
          >> "$GITHUB_STEP_SUMMARY"
