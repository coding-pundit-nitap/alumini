rule_files:
  - ../rules/backups.yml
evaluation_interval: 1m

tests:
  # archive_command fails once a minute: pages after 10 minutes.
  - interval: 1m
    input_series:
      - series: 'pg_stat_archiver_failed_count{job="postgres",instance="pg"}'
        values: "0+1x30"
      - series: 'pg_stat_archiver_last_archive_age{job="postgres",instance="pg"}'
        values: "60+60x30"
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="full"}'
        values: "0x30"
    alert_rule_test:
      - eval_time: 5m
        alertname: WalArchiveFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: WalArchiveFailing
        exp_alerts:
          - exp_labels:
              { severity: page, service: postgres, job: postgres, instance: pg }
            exp_annotations:
              summary: "PostgreSQL cannot archive WAL to the backup repository"
              description: "archive_command failed 15 times in 15 minutes. Point-in-time recovery stops at the last archived segment, and pg_wal grows until the disk fills."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md
      # 31 minutes since the last segment: inside the hourly check's window.
      - eval_time: 30m
        alertname: WalArchiveStale
        exp_alerts: []

  # Nothing archived for 80 minutes.
  - interval: 1m
    input_series:
      - series: 'pg_stat_archiver_last_archive_age{job="postgres",instance="pg"}'
        values: "4800x10"
      - series: 'pg_stat_archiver_failed_count{job="postgres",instance="pg"}'
        values: "0x10"
    alert_rule_test:
      - eval_time: 10m
        alertname: WalArchiveStale
        exp_alerts:
          - exp_labels:
              { severity: page, service: postgres, job: postgres, instance: pg }
            exp_annotations:
              summary: "No WAL segment archived for over 75 minutes"
              description: "The last segment reached the repository 1h 20m 0s ago; the 15-minute RPO no longer holds."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md
      - eval_time: 10m
        alertname: WalArchiveFailing
        exp_alerts: []

  # Base backups last succeeded at t=0; uploads, dumps and full backups keep succeeding until verify is late.
  - interval: 1h
    input_series:
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="full"}'
        values: "0x240"
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="diff"}'
        values: "0x240"
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="uploads"}'
        values: "0+3600x240"
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="dump"}'
        values: "0+3600x240"
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="verify"}'
        values: "0x240"
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="restore_test"}'
        values: "0+3600x240"
    alert_rule_test:
      - eval_time: 25h
        alertname: BaseBackupMissed
        exp_alerts: []
      - eval_time: 27h
        alertname: BaseBackupMissed
        exp_alerts:
          - exp_labels: { severity: ticket, service: backups }
            exp_annotations:
              summary: "No successful base backup in 26 hours"
              description: "The last full or differential backup finished 1d 3h 0m 0s ago. WAL still covers recovery, but a restore replays more of it."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md
      - eval_time: 7d
        alertname: BackupJobOverdue
        exp_alerts: []
      - eval_time: 9d
        alertname: BackupJobOverdue
        exp_alerts:
          - exp_labels:
              {
                severity: ticket,
                service: backups,
                job: node,
                instance: h,
                kind: full,
              }
            exp_annotations:
              summary: "Backup job full has not succeeded on schedule"
              description: "The last successful full run was 9d 0h 0m 0s ago."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md
          - exp_labels:
              {
                severity: ticket,
                service: backups,
                job: node,
                instance: h,
                kind: verify,
              }
            exp_annotations:
              summary: "Backup job verify has not succeeded on schedule"
              description: "The last successful verify run was 9d 0h 0m 0s ago."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md
      - eval_time: 9d
        alertname: RestoreTestOverdue
        exp_alerts: []
      - eval_time: 9d
        alertname: BackupMetricsMissing
        exp_alerts: []

  # The restore test last passed at t=0.
  - interval: 1d
    input_series:
      - series: 'alumini_backup_last_success_timestamp_seconds{job="node",instance="h",kind="restore_test"}'
        values: "0x40"
    alert_rule_test:
      - eval_time: 34d
        alertname: RestoreTestOverdue
        exp_alerts: []
      - eval_time: 36d
        alertname: RestoreTestOverdue
        exp_alerts:
          - exp_labels:
              {
                severity: page,
                service: backups,
                job: node,
                instance: h,
                kind: restore_test,
              }
            exp_annotations:
              summary: "No successful restore test in 35 days"
              description: "The monthly restore test last passed 36d 0h 0m 0s ago."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md

  # No backup metrics at all.
  - interval: 1m
    input_series:
      - series: 'pg_stat_archiver_failed_count{job="postgres",instance="pg"}'
        values: "0x90"
    alert_rule_test:
      - eval_time: 30m
        alertname: BackupMetricsMissing
        exp_alerts: []
      - eval_time: 65m
        alertname: BackupMetricsMissing
        exp_alerts:
          - exp_labels: { severity: ticket, service: backups, kind: full }
            exp_annotations:
              summary: "No backup metrics reach Prometheus"
              description: "alumini_backup_last_success_timestamp_seconds is absent, so the backup alerts cannot fire."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-8.md
