rule_files:
  - ../rules/api.yml
evaluation_interval: 1m

tests:
  # 10 % of 100 req/min fail: fires after 5 minutes.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="web",method="GET",route="/api/v1/posts",status="500",status_class="5xx"}'
        values: "0+10x20"
      - series: 'http_requests_total{job="web",method="GET",route="/api/v1/posts",status="200",status_class="2xx"}'
        values: "0+90x20"
    alert_rule_test:
      - eval_time: 3m
        alertname: HighErrorRate
        exp_alerts: []
      - eval_time: 10m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: { severity: page, service: web }
            exp_annotations:
              summary: "More than 2 % of API requests fail with 5xx"
              description: "10% of API requests returned 5xx over the last 5 minutes."
              runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-2.md

  # 1 % fails: below the threshold.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="web",method="GET",route="/api/v1/posts",status="500",status_class="5xx"}'
        values: "0+1x20"
      - series: 'http_requests_total{job="web",method="GET",route="/api/v1/posts",status="200",status_class="2xx"}'
        values: "0+99x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []

  # Half of the requests fail, but only 10 requests per 5 minutes: the low-traffic guard holds it back.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{job="web",method="GET",route="/api/v1/posts",status="500",status_class="5xx"}'
        values: "0+1x20"
      - series: 'http_requests_total{job="web",method="GET",route="/api/v1/posts",status="200",status_class="2xx"}'
        values: "0+1x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighErrorRate
        exp_alerts: []

  # Every request takes 0.5–1 s at 20 req/min: ticket after 10 minutes, page after 30.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="web",method="GET",route="/api/v1/posts",status_class="2xx",le="0.5"}'
        values: "0x40"
      - series: 'http_request_duration_seconds_bucket{job="web",method="GET",route="/api/v1/posts",status_class="2xx",le="1"}'
        values: "0+20x40"
      - series: 'http_request_duration_seconds_bucket{job="web",method="GET",route="/api/v1/posts",status_class="2xx",le="+Inf"}'
        values: "0+20x40"
      - series: 'http_request_duration_seconds_count{job="web",method="GET",route="/api/v1/posts",status_class="2xx"}'
        values: "0+20x40"
    alert_rule_test:
      - eval_time: 15m
        alertname: HighLatencyP95
        exp_alerts:
          - exp_labels: { severity: ticket, service: web }
            exp_annotations:
              summary: API p95 latency above 500 ms (SRS §47)
              description: p95 over the last 5 minutes is 975ms.
              runbook_url: "https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-2.md"
      - eval_time: 15m
        alertname: HighLatencyP95Sustained
        exp_alerts: []
      - eval_time: 35m
        alertname: HighLatencyP95Sustained
        exp_alerts:
          - exp_labels: { severity: page, service: web }
            exp_annotations:
              summary: API p95 latency above 500 ms for 30 minutes
              description: p95 over the last 5 minutes is 975ms; the ticket-level alert has not cleared.
              runbook_url: "https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-2.md"

  # Fast requests never fire.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_bucket{job="web",method="GET",route="/api/v1/posts",status_class="2xx",le="0.1"}'
        values: "0+20x40"
      - series: 'http_request_duration_seconds_bucket{job="web",method="GET",route="/api/v1/posts",status_class="2xx",le="+Inf"}'
        values: "0+20x40"
      - series: 'http_request_duration_seconds_count{job="web",method="GET",route="/api/v1/posts",status_class="2xx"}'
        values: "0+20x40"
    alert_rule_test:
      - eval_time: 35m
        alertname: HighLatencyP95
        exp_alerts: []
