# Local scrape config for docker/docker-compose.observability.yml. Production uses production.yml.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # --enable-feature=expand-external-labels: RUNBOOK_BASE comes from the repo's .env. Alert runbook_url
  # annotations are built from runbook_base.
  external_labels:
    runbook_base: ${RUNBOOK_BASE}

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # The app processes run on the host (`pnpm dev`, `pnpm --filter @nitap/worker dev`).
  - job_name: web
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:3001"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis-cache
    static_configs:
      - targets: ["redis-exporter-cache:9121"]
  - job_name: redis-queue
    static_configs:
      - targets: ["redis-exporter-queue:9121"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
