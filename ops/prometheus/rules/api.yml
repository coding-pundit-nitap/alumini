# HTTP RED for /api routes. Ratio rules need >= 50 requests in the window.
groups:
  - name: api
    rules:
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{job="web",status_class="5xx"}[5m]))
              / sum(rate(http_requests_total{job="web"}[5m]))
          ) > 0.02
          and sum(increase(http_requests_total{job="web"}[5m])) >= 50
        for: 5m
        labels: { severity: page, service: web }
        annotations:
          summary: "More than 2 % of API requests fail with 5xx"
          description: "{{ $value | humanizePercentage }} of API requests returned 5xx over the last 5 minutes."
          runbook_url: "{{ $externalLabels.runbook_base }}/R-2.md"

      - alert: HighLatencyP95
        expr: &p95 |
          histogram_quantile(0.95,
            sum by (le) (rate(http_request_duration_seconds_bucket{job="web",route=~"/api/.*"}[5m]))
          ) > 0.5
          and sum(increase(http_request_duration_seconds_count{job="web",route=~"/api/.*"}[5m])) >= 50
        for: 10m
        labels: { severity: ticket, service: web }
        annotations:
          summary: "API p95 latency above 500 ms"
          description: "p95 over the last 5 minutes is {{ $value | humanizeDuration }}."
          runbook_url: "{{ $externalLabels.runbook_base }}/R-2.md"

      - alert: HighLatencyP95Sustained
        expr: *p95
        for: 30m
        labels: { severity: page, service: web }
        annotations:
          summary: "API p95 latency above 500 ms for 30 minutes"
          description: "p95 over the last 5 minutes is {{ $value | humanizeDuration }}; the ticket-level alert has not cleared."
          runbook_url: "{{ $externalLabels.runbook_base }}/R-2.md"
