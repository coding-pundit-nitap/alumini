# Auth & security. auth_sign_in_total{outcome} is counted by the /api/auth POST handler.
groups:
  - name: security
    rules:
      # A starting threshold: reliability sets it from data, so retune it after a month of production.
      - alert: LoginFailureSpike
        expr: sum(increase(auth_sign_in_total{job="web",outcome=~"invalid_credentials|rate_limited"}[10m])) > 50
        for: 10m
        labels: { severity: ticket, service: web }
        annotations:
          summary: "Spike in failed and rate-limited sign-ins"
          description: "{{ $value | humanize }} sign-ins failed or were rate limited in 10 minutes. Credential stuffing or a broken login."
          runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-9.md

      - alert: AdminPermissionDenialSpike
        expr: |
          sum(increase(authz_decisions_total{job="web",outcome="denied",permission=~"user\\.(read_admin|suspend|reactivate)|role\\.assign|permission\\.grant|audit\\.read|system\\.configure|notification\\.replay|analytics\\.view|donation\\.view_all|campaign\\.manage|message\\.read_reported"}[10m])) > 20
        for: 10m
        labels: { severity: ticket, service: web }
        annotations:
          summary: "Spike in denied admin-tier permission checks"
          description: "{{ $value | humanize }} admin-tier permission checks were denied in 10 minutes. Review who is probing."
          runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-9.md

      - alert: AuthzDenialAuditFailing
        expr: increase(authz_denied_audit_failed_total{job="web"}[10m]) > 0
        labels: { severity: ticket, service: web }
        annotations:
          summary: "Denied admin actions are not being audited"
          description: "{{ $value | humanize }} audit writes for denied permission checks failed in 10 minutes."
          runbook_url: https://github.com/krotrn/alumini/blob/main/ops/runbooks/R-9.md
