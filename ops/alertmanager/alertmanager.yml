# Routing. Receiver URLs are read from files so no secret lives in Git:
# mount the real ones at /etc/alertmanager/secrets at deploy time; secrets.example/ holds local placeholders.
global:
  resolve_timeout: 5m

route:
  receiver: ticket
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 24h
  routes:
    # Always firing; the external dead-man's switch pages when these heartbeats STOP.
    # A repeat goes out only on a group_interval tick once repeat_interval has passed. With both at 1m, jitter
    # makes every other tick fall just short, and the heartbeat arrives every 2 minutes.
    # Ticks every 30s with a 50s repeat give one heartbeat a minute.
    - matchers: [alertname="Watchdog"]
      receiver: deadmans-switch
      group_wait: 0s
      group_interval: 30s
      repeat_interval: 50s
    - matchers: [severity="page"]
      receiver: pager
      repeat_interval: 1h
    - matchers: [severity="ticket"]
      receiver: ticket
      repeat_interval: 24h

# An instance that is down or not ready explains its own errors and latency: one page, not three.
inhibit_rules:
  - source_matchers: [alertname=~"WebDown|ReadinessFailing"]
    target_matchers:
      [
        alertname=~"HighErrorRate|HighLatencyP95|HighLatencyP95Sustained|SiteProbeFailing",
      ]
    equal: [service]
  - source_matchers: [alertname="QueueRedisDown"]
    target_matchers: [alertname=~"QueueBacklogGrowing|OutboxStuck"]
  - source_matchers: [alertname="PostgresDown"]
    target_matchers:
      [alertname=~"ReadinessFailing|DbPoolSaturated|PostgresConnectionsHigh"]

  # The page-level alert of a pair says everything the ticket-level one does.
  - source_matchers: [alertname="HostDiskFull"]
    target_matchers: [alertname="HostDiskFilling"]
    equal: [instance, mountpoint]
  - source_matchers: [alertname="TlsCertExpiring"]
    target_matchers: [alertname="TlsCertExpiringSoon"]
    equal: [instance]

receivers:
  - name: pager
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/pager_url
        send_resolved: true
  - name: ticket
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/ticket_url
        send_resolved: true
  - name: deadmans-switch
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/deadmans_switch_url
        send_resolved: false
