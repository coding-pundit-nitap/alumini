# Local development services. Production topology is described in docs/architecture/system-architecture.md.
# Run from the repo root: `pnpm docker:up`. `name` is fixed so the project (and its named volumes) does not
# depend on this file's directory: moving the file here would otherwise have orphaned the existing data volume.
name: alumini

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumini
      POSTGRES_PASSWORD: alumini
      POSTGRES_DB: alumini
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumini"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache / rate-limit Redis: evicts under memory pressure, holds nothing unrecoverable.
  # The job queue (ADR-007) will need a SEPARATE Redis with maxmemory-policy noeviction and AOF.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue Redis (ADR-007 §4): a job queue must never lose keys, so this instance must NOT evict and must
  # persist. It is a different instance from the cache Redis above on purpose.
  queue-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    ports:
      - "${QUEUE_REDIS_PORT:-6380}:6379"
    volumes:
      - queue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Object storage for uploads (spec 3C). The official image, pulled from quay.io (Docker Hub no longer
  # serves MinIO's images unauthenticated; bitnami/minio is also gone from Docker Hub as of Bitnami's
  # August 2025 catalog change — only the unmaintained bitnamilegacy/minio remains, and this project does
  # not build on that). It has no env-var bucket auto-create, so `minio-init` creates the bucket once and
  # exits; CI cannot use this as a `services:` entry (no command override there), so the CI workflow
  # starts it with a plain `docker run` step instead.
  minio:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alumini-storage
      MINIO_ROOT_PASSWORD: alumini-storage-secret
      # Browsers POST uploads straight here (spec 3C F-7): allow only the app origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 alumini-storage alumini-storage-secret &&
        mc mb --ignore-existing local/alumini-uploads
      "

  # Development mailbox: accepts any mail over SMTP and shows it at http://localhost:8025. Mail never leaves it.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Reverse-DNS lookups on the connecting IP block the SMTP greeting in this environment (no working
    # PTR resolution for the docker-bridge gateway address), which reads as a hung "greeting never
    # received" to any client outside the container's own loopback. Disabling rDNS is a dev-mailbox-only
    # concern; it never talks to real mail servers.
    command: ["--smtp-disable-rdns"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  queue-redis-data:
  minio-data:
