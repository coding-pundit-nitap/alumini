# Local development services. Run from the repo root: `pnpm docker:up`. `name` is fixed so the
# project and its volumes don't depend on this file's location.
name: alumini

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumini
      POSTGRES_PASSWORD: alumini
      POSTGRES_DB: alumini
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # The 18 image keeps the cluster under 18/docker and refuses a volume made by the 17 image. To move:
    # `pnpm docker:down && docker volume rm alumini_postgres-data && pnpm docker:up`, then `pnpm db:deploy`
    # and `pnpm db:seed` (dev data is rebuilt, not upgraded).
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumini"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache / rate-limit Redis: may evict under memory pressure, so it holds nothing unrecoverable.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Queue Redis: a job queue must never lose keys, so this one never evicts and persists (AOF).
  queue-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    ports:
      - "${QUEUE_REDIS_PORT:-6380}:6379"
    volumes:
      - queue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # MinIO no longer publishes images, so this uses Chainguard's source build, which ships `sh` and `mc`.
  # It can't auto-create buckets, so `minio-init` creates one and exits.
  minio:
    image: cgr.dev/chainguard/minio:latest
    # The image runs as uid 65532, but volumes created by the old official image are root-owned.
    user: "0:0"
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alumini-storage
      MINIO_ROOT_PASSWORD: alumini-storage-secret
      # Browsers POST uploads straight here: allow only the app origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 alumini-storage alumini-storage-secret &&
        mc mb --ignore-existing local/alumini-uploads
      "

  # Development mailbox: accepts any mail over SMTP and shows it at http://localhost:8025. Mail never leaves it.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    # Reverse-DNS lookups on the bridge gateway stall the SMTP greeting; disable them (dev mailbox only).
    command: ["--smtp-disable-rdns"]
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Upload malware scanning. Opt-in: the image downloads its signatures (~300 MB) on first
  # start and clamd holds ~1 GB of RAM, so it runs only with `--profile scan` (pnpm docker:scan). Point the
  # worker at it with CLAMAV_URL=tcp://localhost:3310; without it the worker passes uploads unscanned.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    profiles: ["scan"]
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

volumes:
  postgres-data:
  queue-redis-data:
  minio-data:
  clamav-data:
