# Host Nginx in front of deploy/compose.yml (architecture §5: TLS, size limits, coarse per-IP limits).
# Install as /etc/nginx/sites-available/alumini.conf and replace alumni.example.org everywhere. The certificate
# must exist first: `certbot certonly --webroot -w /var/www/html -d alumni.example.org`.

# Nginx is the edge: it overwrites X-Forwarded-For, because the app trusts its first entry (client-ip.ts).
limit_req_zone $binary_remote_addr zone=alumini_per_ip:10m rate=20r/s;

upstream alumini_web {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name alumni.example.org;
    # Certificate renewals (certbot --webroot).
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name alumni.example.org;

    ssl_certificate /etc/letsencrypt/live/alumni.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alumni.example.org/privkey.pem;

    # Uploads are capped at 5 MB by the presigned policy; a little room for the multipart envelope.
    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    limit_req zone=alumini_per_ip burst=60 nodelay;
    limit_req_status 429;

    # Only monitoring on the host reaches these (the app also checks HEALTH_CHECK_TOKEN).
    location ~ ^/(metrics|health/drain)$ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://alumini_web;
    }

    # Server-sent events: no buffering, long reads (the route sends a heartbeat every 25 s).
    location /api/v1/messages/stream {
        proxy_pass http://alumini_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://alumini_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
