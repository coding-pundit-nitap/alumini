# Single-host production stack. Only `web` is published, on 127.0.0.1, behind the host's Nginx
# (deploy/nginx/alumini.conf). Runs from deploy/ next to its `.env`; releases go through
# deploy/deploy.sh (see deploy/README.md). Staging is another clone whose .env sets COMPOSE_PROJECT_NAME.
name: alumini-prod

# pgBackRest takes its whole configuration from these, in the postgres container (for archive-push,
# which Postgres runs as archive_command) and in postgres-restore. The repository is an off-host S3-compatible
# bucket; everything is encrypted before it leaves the host, with BACKUP_CIPHER_PASS escrowed apart from it.
x-pgbackrest: &pgbackrest
  PGBACKREST_STANZA: alumini
  PGBACKREST_PG1_PATH: /var/lib/postgresql/18/docker
  PGBACKREST_PG1_USER: alumini
  PGBACKREST_PG1_DATABASE: alumini
  PGBACKREST_REPO1_TYPE: s3
  PGBACKREST_REPO1_PATH: /pgbackrest
  PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
  PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:?}
  PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
  PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_KEY:?}
  PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:?}
  PGBACKREST_REPO1_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
  PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
  PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_CIPHER_PASS:?}
  # Fulls are kept 28 days and WAL with them, so point-in-time restore reaches back at least 14.
  PGBACKREST_REPO1_RETENTION_FULL_TYPE: time
  PGBACKREST_REPO1_RETENTION_FULL: "28"
  PGBACKREST_REPO1_RETENTION_DIFF: "14"
  PGBACKREST_REPO1_BUNDLE: "y"
  PGBACKREST_COMPRESS_TYPE: zst
  PGBACKREST_START_FAST: "y"
  PGBACKREST_PROCESS_MAX: "2"
  # The container filesystem is not kept: errors go to stderr (docker logs), nothing to /var/log.
  PGBACKREST_LOG_LEVEL_FILE: "off"
  PGBACKREST_LOG_LEVEL_STDERR: warn

# Docker keeps json-file logs forever by default; an unbounded log is the classic disk-full outage.
# 5 × 10 MB per container, enough for `docker compose logs` during an incident.
x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: "5" }

x-app: &app
  restart: unless-stopped
  logging: *logging
  env_file: .env
  # Service addresses are fixed by this file, so they are derived here rather than typed into .env.
  environment: &app-env
    NODE_ENV: production
    # The runtime role: rows only, no DDL. The migrate job creates it and grants each release.
    DATABASE_URL: postgresql://alumini_app:${APP_DB_PASSWORD:?}@postgres:5432/alumini
    REDIS_URL: redis://redis:6379
    QUEUE_REDIS_URL: redis://queue-redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: alumini-uploads
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
    S3_FORCE_PATH_STYLE: "true"
    S3_PUBLIC_PATH: /storage
    CLAMAV_URL: tcp://clamav:3310
  depends_on: &app-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    queue-redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  web:
    <<: *app
    image: ${WEB_IMAGE:?}
    ports:
      # 127.0.0.1 behind the host's Nginx. Behind a proxy on another machine (e.g. Nginx Proxy Manager),
      # WEB_BIND=0.0.0.0 and WEB_PORT=80, and firewall the port to that proxy: Docker bypasses ufw.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-3000}:3000"
    environment:
      <<: *app-env
      # Uncapped, V8 sizes its heap from the host's memory and web reached 2.3 GB RSS; with 1 GB it stays near
      # 1.5 GB under load (perf 2026-10-01). Override in .env with WEB_NODE_OPTIONS.
      NODE_OPTIONS: ${WEB_NODE_OPTIONS:---max-old-space-size=1024}
    # The drain step lets in-flight requests finish within this.
    stop_grace_period: 30s

  worker:
    <<: *app
    image: ${WORKER_IMAGE:?}
    depends_on:
      <<: *app-deps
      clamav: { condition: service_started }
    stop_grace_period: 30s

  # One-shot: `docker compose run --rm migrate`. Also runs the first-admin bootstrap (deploy/README.md). The only
  # service that connects as the owner: it migrates, seeds, then grants the runtime role (APP_DB_PASSWORD).
  migrate:
    logging: *logging
    image: ${MIGRATE_IMAGE:?}
    profiles: ["tools"]
    env_file: .env
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://alumini:${POSTGRES_PASSWORD:?}@postgres:5432/alumini
    depends_on:
      postgres: { condition: service_healthy }

  # docker/postgres.Dockerfile: the official image plus pgBackRest. Released like the app images: CI's build, by
  # digest, in pull mode; built here (`docker compose build postgres`) in build mode, under the default name.
  postgres:
    logging: *logging
    build: &postgres-build
      context: ../docker
      dockerfile: postgres.Dockerfile
    image: ${POSTGRES_IMAGE:-alumini-postgres:18}
    restart: unless-stopped
    # Every WAL segment goes to the repository, and a quiet database still switches segment every 5 minutes, which
    # bounds data loss on host loss (RPO). The 18 image enables data checksums at initdb.
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=alumini archive-push %p
      - -c
      - archive_timeout=300
    environment:
      <<: *pgbackrest
      POSTGRES_USER: alumini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: alumini
    # 18+ keeps the cluster in a versioned directory under this mount (/var/lib/postgresql/18/docker). A volume
    # from the old postgres:17 layout is refused at start; it needs pg_upgrade or dump/restore (deploy/README.md).
    volumes:
      - postgres-data:/var/lib/postgresql
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumini"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Restore tests only (`deploy/backup.sh restore-test`): the same image restoring into its own volume, with
  # archiving off so a restored copy can never push WAL into the production stanza.
  postgres-restore:
    logging: *logging
    build: *postgres-build
    image: ${POSTGRES_IMAGE:-alumini-postgres:18}
    profiles: ["tools"]
    command: ["postgres", "-c", "archive_mode=off"]
    environment:
      <<: *pgbackrest
      POSTGRES_USER: alumini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: alumini
    volumes:
      - postgres-restore-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumini"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache / rate limits: may evict, holds nothing unrecoverable.
  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue: never evicts, persists every second.
  queue-redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - queue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browsers reach it only through the web app's /storage route, so it needs no CORS and no public port.
  minio:
    logging: *logging
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    logging: *logging
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    entrypoint: >
      sh -c '
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/alumini-uploads
      '

  # mc for deploy/backup.sh (uploads mirror, logical dumps), against the same off-host bucket as pgBackRest.
  # The aliases are written as config rather than `mc alias set`, which needs every endpoint up to define one.
  backup-tools:
    logging: *logging
    image: cgr.dev/chainguard/minio:latest
    profiles: ["tools"]
    environment:
      MC_CONFIG_DIR: /tmp/mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:?}
      BACKUP_S3_KEY_SECRET: ${BACKUP_S3_KEY_SECRET:?}
      BACKUP_S3_URI_STYLE: ${BACKUP_S3_URI_STYLE:-host}
    entrypoint: >
      sh -c '
        mkdir -p /tmp/mc &&
        if [ "$$BACKUP_S3_URI_STYLE" = path ]; then style=on; else style=off; fi &&
        printf "{\"version\":\"10\",\"aliases\":{\"local\":{\"url\":\"http://minio:9000\",\"accessKey\":\"%s\",\"secretKey\":\"%s\",\"api\":\"s3v4\",\"path\":\"on\"},\"backup\":{\"url\":\"https://%s\",\"accessKey\":\"%s\",\"secretKey\":\"%s\",\"api\":\"s3v4\",\"path\":\"%s\"}}}" \
          "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" "$$BACKUP_S3_ENDPOINT" "$$BACKUP_S3_KEY" "$$BACKUP_S3_KEY_SECRET" "$$style" \
          > /tmp/mc/config.json &&
        exec sh -c "$$0" "$$@"
      '

  # Upload malware scanning; the worker refuses to start in production without it.
  # First start downloads ~300 MB of signatures; clamd holds ~1 GB of RAM.
  clamav:
    logging: *logging
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

volumes:
  postgres-data:
  postgres-restore-data:
  queue-redis-data:
  minio-data:
  clamav-data:
