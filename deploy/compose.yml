# Single-host production stack (reliability §8.3 stage 0: one web, one worker, Postgres, two Redis, object
# storage, clamd). Only `web` is published, and only on 127.0.0.1: the host's Nginx terminates TLS in front of
# it (deploy/nginx/alumini.conf). Everything else stays on the compose network.
#
# Runs from deploy/ in a clone of the repository, next to its `.env` (from deploy/.env.example), which Compose
# reads both for the ${...} below and as each app container's environment. Releases go through
# deploy/deploy.sh, which sets IMAGE_PREFIX and IMAGE_TAG; the procedure is in deploy/README.md.
name: alumini-prod

x-app: &app
  restart: unless-stopped
  env_file: .env
  # Service addresses are fixed by this file, so they are derived here rather than typed into .env.
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://alumini:${POSTGRES_PASSWORD:?}@postgres:5432/alumini
    REDIS_URL: redis://redis:6379
    QUEUE_REDIS_URL: redis://queue-redis:6379
    S3_ENDPOINT: http://minio:9000
    S3_BUCKET: alumini-uploads
    S3_REGION: us-east-1
    S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?}
    S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
    S3_FORCE_PATH_STYLE: "true"
    S3_PUBLIC_PATH: /storage
    CLAMAV_URL: tcp://clamav:3310
  depends_on: &app-deps
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    queue-redis: { condition: service_healthy }
    minio-init: { condition: service_completed_successfully }

services:
  web:
    <<: *app
    image: ${IMAGE_PREFIX:?}web:${IMAGE_TAG:?}
    ports:
      - "127.0.0.1:3000:3000"
    # The drain step (reliability §8.3 step 7) lets in-flight requests finish within this.
    stop_grace_period: 30s

  worker:
    <<: *app
    image: ${IMAGE_PREFIX:?}worker:${IMAGE_TAG:?}
    depends_on:
      <<: *app-deps
      clamav: { condition: service_started }
    stop_grace_period: 30s

  # One-shot: `docker compose run --rm migrate`. Also runs the first-admin bootstrap (deploy/README.md).
  migrate:
    image: ${IMAGE_PREFIX:?}migrate:${IMAGE_TAG:?}
    profiles: ["tools"]
    env_file: .env
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alumini
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: alumini
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alumini"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache / rate limits: may evict, holds nothing unrecoverable.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "allkeys-lru",
        "--save",
        "",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job queue (ADR-007 §4): never evicts, persists every second.
  queue-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--maxmemory-policy",
        "noeviction",
        "--appendonly",
        "yes",
        "--appendfsync",
        "everysec",
      ]
    volumes:
      - queue-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Browsers reach it only through the web app's /storage route, so it needs no CORS and no public port.
  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio:latest
    depends_on:
      minio: { condition: service_healthy }
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    entrypoint: >
      sh -c '
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/alumini-uploads
      '

  # Upload malware scanning; the worker refuses to start in production without it (spec 16 SD-8).
  # First start downloads ~300 MB of signatures; clamd holds ~1 GB of RAM.
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 5

volumes:
  postgres-data:
  queue-redis-data:
  minio-data:
  clamav-data:
